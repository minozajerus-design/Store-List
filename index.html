<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ester's Store</title>


    <link rel="stylesheet" href="style.css">

<body>

<script>
    if (localStorage.getItem("darkMode") === "true") {
        document.body.classList.add("dark-mode");
    }
</script>

<header>

    <h1>🛒 Ester's Store Price's </h1>
    <p>Manage your store items easily.</p>

    <input
        type="text"
        id="search"
        placeholder="🔍 Search items...">

</header>


<main>

<!-- ========================= -->
<!-- ADD ITEM -->
<!-- ========================= -->

<section class="card" id="addItemSection">

<h2>➕ Add New Item</h2>

<div class="form-group">

<label for="productImage"
       class="upload-image-btn"
       id="uploadImageText">
    Choose Product Image
</label>

    <input
        type="file"
        id="productImage"
        accept="image/*"
        hidden
    >

    
<input
type="text"
id="itemName"
placeholder="Item Name">

<input
type="number"
id="itemPrice"
placeholder="Price">

<select id="category">

<option value="snacksTable">
🍪 Foods
</option>

<option value="drinksTable">
🥤 Drinks
</option>

<option value="cigarettesTable">
 🧴 Daily Essentials
</option>

<option value="noodlesTable">
📦Others
</option>

</select>

<button id="addButton">
Add Item
</button>

</div>

</section>

<!-- ========================= -->
<!-- CATEGORY FILTER -->
<!-- ========================= -->

<section class="category-filter">
    <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">
            <span class="filter-icon">🔍</span> All
        </button>
        <button class="filter-btn" data-filter="snacksSection">
            <span class="filter-icon">🍪</span> Snacks
        </button>
        <button class="filter-btn" data-filter="drinksSection">
            <span class="filter-icon">🥤</span> Drinks
        </button>
        <button class="filter-btn" data-filter="cigarettesSection">
            <span class="filter-icon">🧴</span> Daily Essentials
        </button>
        <button class="filter-btn" data-filter="noodlesSection">
            <span class="filter-icon">📦</span> Others
        </button>
    </div>
</section>

<!-- ========================= -->
<!-- SNACKS -->
<!-- ========================= -->

<section class="card" id="snacksSection">

<h2>🍪 Foods</h2>

<table id="snacksTable">
    <thead>
        <tr>
            <th>Picture</th>
            <th>Item</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
</table>

</section>

<!-- ========================= -->
<!-- DRINKS -->
<!-- ========================= -->

<section class="card" id="drinksSection">

<h2>🥤 Drinks</h2>

<table id="drinksTable">
    <thead>
        <tr>
            <th>Picture</th>
            <th>Item</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
</table>
</section>

<!-- ========================= -->
<!-- CIGARETTES -->
<!-- ========================= -->

<section class="card" id="cigarettesSection">

<h2>🧴 Daily Essentials </h2>

<table id="cigarettesTable">
    <thead>
        <tr>
            <th>Picture</th>
            <th>Item</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
</table>

</section>

<!-- ========================= -->
<!-- INSTANT NOODLES -->
<!-- ========================= -->

<section class="card" id="noodlesSection">

<h2>📦 Others</h2>

<table id="noodlesTable">
    <thead>
        <tr>
            <th>Picture</th>
            <th>Item</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
</table>

</section>

<!-- ========================= -->
<!-- STORE INFORMATION SECTION REMOVED (contained Clear All) -->
<!-- ========================= -->

</main>

<footer>

<p>
&copy; 2026 Ester's Store Manager
</p>

</footer>

<button id="darkModeBtn">🌙 Dark Mode</button>
<button id="editModeBtn">✏️ Edit Mode</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js" defer></script>

<div id="imagePopup" class="image-popup">
    <button id="closeImagePopup" class="close-image-popup">✕</button>
    <img id="popupImage" src="" alt="Product preview">
</div>

</body>
</html>
